[project]
name = "rag-from-scratch"
version = "0.1.0"
description = "A weekend project on creating a RAG using langchain"
readme = "README.md"
requires-python = ">=3.13.12"
dependencies = [
    "chromadb>=1.5.5",
    "langchain>=1.2.15",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.12",
    "langchainhub>=0.1.21",
    "pydantic>=2.12.5",
    "pypdf>=6.9.2",
    "python-dotenv>=1.2.2",
    "pytrends>=4.9.2",
    "streamlit>=1.57.0",
    "tiktoken>=0.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.9",
]

[tool.ruff.lint]
extend-select = ["B"]
